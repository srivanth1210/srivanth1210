name: Render profile artwork

on:
  push:
    paths:
      - "assets/profile-design-final.svg"
      - ".github/workflows/render-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install renderer
        run: pip install cairosvg
      - name: Render PNG
        run: python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="assets/profile-design-final.svg",
              write_to="assets/profile-design-final.png",
              output_width=1536,
              output_height=2304,
          )
          PY
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-design-final.png
          git diff --cached --quiet || git commit -m "Render profile design as PNG"
          git push
